[package]
name = "tv-assistant"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
directories = "6"
gpui = "0.2.2"
if-addrs = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wait-timeout = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
